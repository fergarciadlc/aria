[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-dataset"
version = "0.1.0"
description = "ARIA: Authentic vs Reconstructed Isolated Audio dataset library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Fernando"}
]
keywords = ["audio", "deepfake", "dataset", "machine-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

dependencies = [
    "numpy>=1.21",
    "soundfile>=0.12",
    "scipy>=1.9",
    "tqdm>=4.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
]
generators = [
    "torch>=2.0",
    "transformers>=4.38",
]
scripts = [
    "loguru>=0.7",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
all = [
    "aria-dataset[torch,generators,scripts,dev]",
]

[project.scripts]
aria = "aria.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/aria"
Documentation = "https://github.com/your-org/aria#readme"
Repository = "https://github.com/your-org/aria"

[tool.setuptools.packages.find]
include = ["aria*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]


